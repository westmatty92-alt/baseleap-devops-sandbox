# .github/workflows/qa-staging.yml: TEMPLATE (owned by bl-devops). QA's smoke suite on every successful staging deploy.
name: qa-staging

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: qa-staging
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.ref == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      PRODUCTION_HOSTS: ${{ vars.PRODUCTION_HOSTS }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-staging-smoke
          path: |
            docs/qa-reports/
            .baseleap/reports/playwright-html/
          retention-days: 14
