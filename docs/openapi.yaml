openapi: 3.1.0
info:
  title: Tech Job Board API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Contract for the Northside Plumbing Tech Job Board. Single source of truth for bl-frontend and
    bl-backend. Locked at Gate 2; changes after that are additive only.

    Conventions:
    - JSON fields are snake_case. Ids are uuids.
    - `job_date` is a calendar date (YYYY-MM-DD) and `start_time` a wall-clock time (HH:MM), both in
      the organisation's time zone (America/Toronto). They are never converted (decision 0006).
      Record timestamps (`created_at`, `updated_at`) are UTC date-time.
    - Text lengths count Unicode code points (Postgres `char_length`), so the frontend counts with
      `[...value].length`, not `value.length`.
    - Optional text fields: send `null` (or omit on create) for "not entered"; the server turns an
      empty or whitespace-only string into `null`. Title, address, name and customer name are trimmed.
    - Every write that changes a job sends the `version` the screen was showing. A mismatch returns
      409 `stale_version` with the latest job (FR-14).
    - Errors are `application/problem+json` (RFC 9457) with a machine-readable `code`.
    - Signing in (request a code or link, verify a code, confirm a link) happens before a session
      exists and is not part of this API. See `docs/architecture.md` "Sign-in (outside the JSON API)".
    - There is no DELETE on any resource. A DELETE on any path returns 405 (FR-11, NG-6).
servers:
  - url: /api
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: System
    description: Health check
  - name: Session
    description: Who is signed in
  - name: Board
    description: The day board
  - name: Jobs
    description: Create, read and change jobs
  - name: Team
    description: The team list (owner only)
  - name: Events
    description: Client-side analytics events
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check for uptime monitors, smoke tests and the e2e suite
      description: Returns 200 when the app is serving. With `check=db` it also runs `select 1` against Supabase and returns 503 if that fails. No session needed. Returns no data about anyone.
      tags: [System]
      x-stories: [US-006]
      security: []
      parameters:
        - name: check
          in: query
          required: false
          description: Add a database round trip to the check
          schema:
            type: string
            enum: [db]
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, checks: { app: ok, db: ok }, version: 3f2c1ab }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: A dependency is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: degraded, checks: { app: ok, db: down }, version: 3f2c1ab }
  /me:
    get:
      operationId: getMe
      summary: The signed-in team member, their role and the organisation's today
      description: Used by every signed-in screen to decide which controls to show. A removed member gets 401 (their session no longer maps to an active team member).
      tags: [Session]
      x-stories: [US-001, US-002, US-004]
      responses:
        '200':
          description: The signed-in member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                member: { id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01, name: Tech A, role: technician }
                org: { id: 5d7c2f10-8e44-4c1b-b1f3-2a9e6d4c7a10, name: Northside Plumbing, time_zone: America/Toronto, today: '2026-11-12' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /board:
    get:
      operationId: getBoard
      summary: Every job of one day, in start-time order, ties by earliest created
      description: |
        The whole day in one response, not paged (decision 0005: FR-6 needs at least 50 jobs and no
        "page 2"). The server caps the list at 500 and sets `truncated` if there were more. Without
        `date` the server uses today in the organisation's time zone (AC-004.8). Always reads current
        data; responses are sent with `Cache-Control: no-store`.
      tags: [Board]
      x-stories: [US-004, US-006, US-007, US-009, US-010]
      parameters:
        - name: date
          in: query
          required: false
          description: Day to show (YYYY-MM-DD, 2020-01-01 to 2100-12-31). Defaults to today in America/Toronto.
          schema:
            type: string
            format: date
          example: '2026-11-12'
      responses:
        '200':
          description: The day's board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardDay' }
              example:
                date: '2026-11-12'
                today: '2026-11-12'
                is_today: true
                viewer: { member_id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01, role: technician }
                job_count: 1
                truncated: false
                jobs:
                  - id: 9a1d2c3b-4e5f-4a6b-8c7d-1e2f3a4b5c6d
                    job_date: '2026-11-12'
                    start_time: '15:30'
                    title: Leaking kitchen faucet
                    address: 45 Main St W, Hamilton
                    customer_name: Pat Example
                    customer_phone: (905) 555-0123
                    notes: Key under mat
                    status: scheduled
                    version: 1
                    assigned_technician: { id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01, name: Tech A, is_active: true }
                    is_mine: true
                    permissions: { change_status: true, edit_notes: true, edit_all: false, cancel: false }
                    created_at: '2026-11-12T19:00:00Z'
                    updated_at: '2026-11-12T19:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs:
    post:
      operationId: createJob
      summary: Owner creates a job and assigns it to an active technician
      description: |
        Owner only. New jobs start Scheduled. `client_request_id` is generated when the form opens
        and reused on every retry of the same form: a repeat returns the job already created with
        200 instead of creating a second one (AC-003.6, AC-003.11). A start time earlier than now is
        accepted (AC-003.7). If the technician was removed after the form opened → 422 with
        `code: technician_not_assignable` on `assigned_member_id` (AC-003.10).
      tags: [Jobs]
      x-stories: [US-003, US-006, US-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
            example:
              client_request_id: 3c1e7f20-5b2a-4d8e-9f10-6a7b8c9d0e1f
              title: Leaking kitchen faucet
              assigned_member_id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01
              job_date: '2026-11-12'
              start_time: '15:30'
              address: 45 Main St W, Hamilton
              customer_name: Pat Example
              customer_phone: (905) 555-0123
              notes: Key under mat
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '200':
          description: Same client_request_id seen before; the job already created is returned and nothing new is saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: One job with all its fields, its version and what the viewer may do with it
      tags: [Jobs]
      x-stories: [US-007, US-008, US-009]
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateJob
      summary: Change a job's fields (owner any field and status; assigned technician notes only)
      description: |
        Send `version` plus only the fields that change. Owner: any field, reassign to another
        active technician, any status including restoring a cancelled job (FR-10, FR-11). Assigned
        technician: `notes` only, and not on a cancelled job. Anything else → 403 (AC-007.4,
        AC-007.5). Use `PUT /jobs/{job_id}/status` for a status-only change and
        `POST /jobs/{job_id}/cancel` to cancel. A save that changes nothing returns the job unchanged.
      tags: [Jobs]
      x-stories: [US-007, US-008, US-009, US-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobUpdate' }
            example: { version: 3, start_time: '16:00' }
      responses:
        '200':
          description: The job after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs/{job_id}/status:
    parameters:
      - $ref: '#/components/parameters/JobId'
    put:
      operationId: setJobStatus
      summary: Set a job's status (assigned technician Scheduled / In progress / Done; owner any)
      description: |
        Any of Scheduled, In progress and Done can follow any other (AC-007.6). Only the owner may
        send `cancelled`. If the job already has the requested status the call is a no-op and returns
        200 with the job, whatever `version` says, so a double tap records one change (AC-007.9).
        Otherwise a `version` mismatch → 409 (AC-007.8, AC-008.6).
      tags: [Jobs]
      x-stories: [US-007, US-008, US-009]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobStatusUpdate' }
            example: { version: 1, status: in_progress }
      responses:
        '200':
          description: The job with its new (or unchanged) status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Owner cancels a job; it stays on the board marked Cancelled
      description: |
        Owner only, after the screen's confirmation. Cancelling an already-cancelled job is a no-op
        that returns 200 and records nothing (AC-009.5), whatever `version` says. Otherwise a
        `version` mismatch → 409. To restore, the owner sets another status (`PUT .../status`).
      tags: [Jobs]
      x-stories: [US-009]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCancel' }
            example: { version: 2 }
      responses:
        '200':
          description: The cancelled job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleVersion' }
  /technicians:
    get:
      operationId: listTechnicians
      summary: Active technicians the owner can assign (names only), by name
      description: Owner only. Removed technicians are never listed (AC-008.5, AC-011.3). The owner is not a technician (OQ-8).
      tags: [Team]
      x-stories: [US-002, US-003, US-008, US-011]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of active technicians
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicianPage' }
              example:
                data:
                  - { id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01, name: Tech A }
                  - { id: 7f2a9c44-1b3d-4e5f-8a6b-9c0d1e2f3a4b, name: Tech B }
                next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team:
    get:
      operationId: listTeamMembers
      summary: Everyone on the team list (owner first, then active by name, then removed by name)
      description: Owner only (SCR-06). Technicians get 403 and see SCR-08 (AC-002.6).
      tags: [Team]
      x-stories: [US-002, US-011]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of team members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberPage' }
              example:
                data:
                  - { id: 2c4e6a8b-0d1f-4a3b-9c5d-7e9f1a3b5c7d, name: Owner, email: owner@example.test, role: owner, is_active: true, created_at: '2026-11-12T14:00:00Z', removed_at: null }
                  - { id: 0b6e3a51-4a1f-4d7a-9a55-3c2a1f0e9b01, name: Tech A, email: tech.a@example.test, role: technician, is_active: true, created_at: '2026-11-12T14:05:00Z', removed_at: null }
                next_cursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: addTeamMember
      summary: Owner adds a technician, or makes a removed one active again
      description: |
        Owner only. Email is trimmed and matched case-insensitively (AC-002.3). An email already on
        the active team → 409 `duplicate_email`. An email of a removed member reactivates that row
        (the name is updated to the one typed) and returns 200 with `reactivated: true`
        (AC-011.5). No email is sent to the person (FR-3). An email that belongs to another
        organisation also gets 409 `duplicate_email`, with the same message.
      tags: [Team]
      x-stories: [US-002, US-011]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMemberCreate' }
            example: { name: Tech A, email: tech.a@example.test }
      responses:
        '201':
          description: Added as a new technician
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberAdded' }
        '200':
          description: A removed technician was made active again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberAdded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/{member_id}/remove:
    parameters:
      - name: member_id
        in: path
        required: true
        description: Team member id
        schema: { type: string, format: uuid }
    post:
      operationId: removeTeamMember
      summary: Owner removes a technician's access; their name stays on past jobs
      description: |
        Owner only, after the screen's confirmation. The member can no longer read anything from
        their next request (RLS), and their auth user is banned so no new code or refresh works
        (AC-011.1). Removing the owner → 403 `owner_cannot_be_removed` (AC-011.4). Removing someone
        already removed returns 200 unchanged.
      tags: [Team]
      x-stories: [US-011]
      responses:
        '200':
          description: The member, now removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    post:
      operationId: recordClientEvent
      summary: Record a client-side analytics event (board_viewed or board_load_failed)
      description: |
        The server stamps the caller's member id and role; the body never names a person. Only ids,
        dates, counts and enums are accepted (docs/metrics-spec.md). The frontend queues
        `board_load_failed` while offline and sends it when the connection returns.
        Limited to 120 events per member per hour.
      tags: [Events]
      x-stories: [US-004]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientEvent' }
            example: { name: board_viewed, board_date: '2026-11-12', is_today: true, job_count: 3, load_ms: 850 }
      responses:
        '202':
          description: Recorded
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: Supabase session cookie set by @supabase/ssr (actual name is `sb-` + project ref + `-auth-token`, possibly chunked). Used by the app's own pages.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token. Used by tests and tools.
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: Job id
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's next_cursor
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, checks, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: false
          required: [app]
          properties:
            app: { type: string, enum: [ok] }
            db: { type: string, enum: [ok, down] }
        version:
          type: string
          description: Short git commit of the deployment
          maxLength: 40
    Role:
      type: string
      enum: [owner, technician]
    JobStatus:
      type: string
      enum: [scheduled, in_progress, done, cancelled]
      description: New jobs start scheduled. Only the owner sets or leaves cancelled.
    Me:
      type: object
      additionalProperties: false
      required: [member, org]
      properties:
        member:
          type: object
          additionalProperties: false
          required: [id, name, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 60 }
            role: { $ref: '#/components/schemas/Role' }
        org:
          type: object
          additionalProperties: false
          required: [id, name, time_zone, today]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 100 }
            time_zone: { type: string, examples: [America/Toronto] }
            today:
              type: string
              format: date
              description: Today's date in the organisation's time zone
    TechnicianRef:
      type: object
      additionalProperties: false
      required: [id, name, is_active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        is_active:
          type: boolean
          description: false → show the name with "(removed)" (AC-011.2)
    JobPermissions:
      type: object
      additionalProperties: false
      description: What the viewer may do with this job, worked out by the server from the permission matrix. The UI shows controls from these; the server enforces them anyway.
      required: [change_status, edit_notes, edit_all, cancel]
      properties:
        change_status: { type: boolean }
        edit_notes: { type: boolean }
        edit_all: { type: boolean }
        cancel: { type: boolean }
    Job:
      type: object
      additionalProperties: false
      required: [id, job_date, start_time, title, address, customer_name, customer_phone, notes, status, version, assigned_technician, is_mine, permissions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        job_date: { type: string, format: date }
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Wall-clock HH:MM in the organisation's time zone
        title: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 200 }
        customer_name:
          type: [string, 'null']
          maxLength: 100
        customer_phone:
          type: [string, 'null']
          pattern: '^[0-9 +()-]{7,20}$'
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: Plain text, line breaks kept. Never render as HTML.
        status: { $ref: '#/components/schemas/JobStatus' }
        version:
          type: integer
          minimum: 1
          description: Send back on every change (FR-14)
        assigned_technician: { $ref: '#/components/schemas/TechnicianRef' }
        is_mine:
          type: boolean
          description: Assigned to the signed-in member ("Your job" tag)
        permissions: { $ref: '#/components/schemas/JobPermissions' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardDay:
      type: object
      additionalProperties: false
      required: [date, today, is_today, viewer, job_count, truncated, jobs]
      properties:
        date: { type: string, format: date }
        today:
          type: string
          format: date
          description: Today in the organisation's time zone, for the Today button
        is_today: { type: boolean }
        viewer:
          type: object
          additionalProperties: false
          required: [member_id, role]
          properties:
            member_id: { type: string, format: uuid }
            role: { $ref: '#/components/schemas/Role' }
        job_count:
          type: integer
          minimum: 0
          description: Number of jobs on the day, cancelled included
        truncated:
          type: boolean
          description: true only if the day had more than 500 jobs
        jobs:
          type: array
          maxItems: 500
          description: Ordered by start_time, then created_at (earliest first). Cancelled jobs keep their position.
          items: { $ref: '#/components/schemas/Job' }
    JobCreate:
      type: object
      additionalProperties: false
      required: [client_request_id, title, assigned_member_id, job_date, start_time, address]
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Generated when the form opens; reused on retries of the same form
        title: { type: string, minLength: 1, maxLength: 100 }
        assigned_member_id:
          type: string
          format: uuid
          description: An active technician (from listTechnicians)
        job_date:
          type: string
          format: date
          description: 2020-01-01 to 2100-12-31. In the P0 build the form always sends today.
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        address: { type: string, minLength: 1, maxLength: 200 }
        customer_name:
          type: [string, 'null']
          maxLength: 100
        customer_phone:
          type: [string, 'null']
          pattern: '^[0-9 +()-]{7,20}$'
        notes:
          type: [string, 'null']
          maxLength: 2000
    JobUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 100 }
        assigned_member_id: { type: string, format: uuid }
        job_date: { type: string, format: date }
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        address: { type: string, minLength: 1, maxLength: 200 }
        customer_name:
          type: [string, 'null']
          maxLength: 100
        customer_phone:
          type: [string, 'null']
          pattern: '^[0-9 +()-]{7,20}$'
        notes:
          type: [string, 'null']
          maxLength: 2000
        status: { $ref: '#/components/schemas/JobStatus' }
    JobStatusUpdate:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/JobStatus' }
    JobCancel:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    Technician:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
    TechnicianPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Technician' }
        next_cursor: { type: [string, 'null'] }
    TeamMember:
      type: object
      additionalProperties: false
      required: [id, name, email, role, is_active, created_at, removed_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        removed_at: { type: [string, 'null'], format: date-time }
    TeamMemberPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
        next_cursor: { type: [string, 'null'] }
    TeamMemberCreate:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
    TeamMemberAdded:
      type: object
      additionalProperties: false
      required: [member, reactivated]
      properties:
        member: { $ref: '#/components/schemas/TeamMember' }
        reactivated:
          type: boolean
          description: true when a removed member was made active again
    BoardViewedEvent:
      type: object
      additionalProperties: false
      required: [name, board_date, is_today, job_count, load_ms]
      properties:
        name: { type: string, const: board_viewed }
        board_date: { type: string, format: date }
        is_today: { type: boolean }
        job_count: { type: integer, minimum: 0, maximum: 100000 }
        load_ms:
          type: integer
          minimum: 0
          maximum: 600000
          description: Navigation start to list drawn
    BoardLoadFailedEvent:
      type: object
      additionalProperties: false
      required: [name, board_date, error_kind]
      properties:
        name: { type: string, const: board_load_failed }
        board_date: { type: string, format: date }
        error_kind: { type: string, enum: [network, server, auth] }
    ClientEvent:
      oneOf:
        - $ref: '#/components/schemas/BoardViewedEvent'
        - $ref: '#/components/schemas/BoardLoadFailedEvent'
      discriminator:
        propertyName: name
        mapping:
          board_viewed: '#/components/schemas/BoardViewedEvent'
          board_load_failed: '#/components/schemas/BoardLoadFailedEvent'
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Machine-readable reason. The UI picks its message from this.
          enum:
            - bad_request
            - unauthenticated
            - not_allowed
            - not_found
            - stale_version
            - duplicate_email
            - owner_cannot_be_removed
            - technician_not_assignable
            - validation_failed
            - rate_limited
        errors:
          type: array
          description: Field errors for 422
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              code:
                type: string
                enum: [required, too_long, invalid_format, invalid_date, technician_not_assignable]
    StaleProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current]
          properties:
            current: { $ref: '#/components/schemas/Job' }
  responses:
    BadRequest:
      description: Malformed request (bad JSON, unknown query value)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Bad request, status: 400, code: bad_request }
    Unauthorized:
      description: No valid session, or the session's person is no longer an active team member
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Sign in again, status: 401, code: unauthenticated }
    Forbidden:
      description: Signed in, but the role or assignment doesn't allow this (UI shows "Not allowed" / SCR-08)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Not allowed, status: 403, code: not_allowed }
    NotFound:
      description: No such resource in the caller's organisation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Not found, status: 404, code: not_found }
    Conflict:
      description: The email is already on a team
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: That email is already on the team, status: 409, code: duplicate_email }
    StaleVersion:
      description: The job changed since the screen loaded it; nothing was saved. `current` holds the latest job.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StaleProblem' }
    ValidationError:
      description: Request failed validation; nothing was saved
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Check the highlighted fields
            status: 422
            code: validation_failed
            errors:
              - { field: title, message: Enter a job title, code: required }
              - { field: customer_phone, message: Enter a valid phone number, code: invalid_format }
    TooManyRequests:
      description: Rate limited; see the Retry-After header
      headers:
        Retry-After:
          description: Seconds to wait
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Too many requests, status: 429, code: rate_limited }
