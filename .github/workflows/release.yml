# .github/workflows/release.yml (owned by bl-devops). The ONLY path to production.
#
# Flow: push to main (a merged staging -> main PR, after Gate 3)
#   -> the job waits for Matthew's approval (GitHub `production` environment, required reviewer)
#   -> drift check (names only) -> migrations (dry run, then apply) -> prebuilt production deploy
#   -> read-only smoke (health must report THIS commit) -> automatic `vercel rollback` if smoke fails.
# Vercel's own Git deploys of `main` are switched off in vercel.json, so nothing else deploys production.
#
# PINNING: `PIN-ME-*` refs and VERCEL_CLI_VERSION are deliberate placeholders; they fail loudly until
# docs/ops/pin-actions.md has been run. Secrets are passed only to the steps that need them (never to `npm ci`).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash # adds pipefail

env:
  VERCEL_CLI_VERSION: "65.16.0" # exact x.y.z of the `vercel` CLI, see docs/ops/pin-actions.md

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_REF }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Configuration is complete
        run: |
          : "${VERCEL_ORG_ID:?GitHub variable VERCEL_ORG_ID is not set in the production environment}"
          : "${VERCEL_PROJECT_ID:?GitHub variable VERCEL_PROJECT_ID is not set in the production environment}"
          : "${SUPABASE_PROJECT_REF:?GitHub variable SUPABASE_PRODUCTION_REF is not set in the production environment}"
          : "${PRODUCTION_URL:?GitHub repository variable PRODUCTION_URL is not set}"
          if ! [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERCEL_CLI_VERSION is not pinned to an exact version (docs/ops/pin-actions.md)."; exit 1
          fi

      - run: npm ci # lockfile-exact; no secrets in this step
      - run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Environment drift check (names only, nothing decrypted)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_ORG_ID }}
        run: node scripts/env-check.mjs --vercel

      - name: Migrations (dry run, then apply)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx --no-install supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/migrations-dry-run.txt"
          npx --no-install supabase db push --yes

      - name: Pull production settings, build, and deploy the prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # The build runs without the token: it only needs the pulled project settings.
          env -u VERCEL_TOKEN vercel build --prod
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke check (read-only; health must report this commit)
        id: smoke
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs "$PRODUCTION_URL" "$EXPECTED_SHA"

      - name: Roll back on failed smoke
        id: rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel rollback --token="$VERCEL_TOKEN"
          echo "::error::Smoke failed (wrong or missing version, or a smoke path not 200): production was rolled back to the previous deployment. Migrations stay applied (expand/contract)."

      - name: Smoke check after rollback (informational)
        if: always() && steps.rollback.outcome == 'success'
        continue-on-error: true
        run: node scripts/smoke.mjs "$PRODUCTION_URL"

      - name: Release summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "### Release ${GITHUB_SHA::7}"
            echo "- Deployment: ${DEPLOY_URL:-not deployed}"
            echo "- Smoke: ${SMOKE}"
            echo "- Automatic rollback: ${ROLLBACK}"
            echo "- Manual rollback: \`vercel rollback\` (undo: \`vercel promote <deployment>\`)"
            if [ -f "$RUNNER_TEMP/migrations-dry-run.txt" ]; then
              echo "- Migrations dry run:"
              echo '```'
              cat "$RUNNER_TEMP/migrations-dry-run.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
