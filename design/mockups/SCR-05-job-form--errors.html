<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New job, errors · Northside Plumbing job board</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<a class="skip" href="#main">Skip to the form</a>
<div class="shell">
<header class="topbar">
  <div class="brand"><span class="brand__name">Northside Plumbing</span><span class="brand__sub">Job board</span></div>
  <button class="btn btn--ghost out" type="button">Sign out</button>
  <nav class="nav" aria-label="Main"><a href="SCR-03-board--owner.html" aria-current="page">Board</a><a href="SCR-06-team.html">Team</a></nav>
  <p class="who">Signed in: Owner</p>
</header>
<main id="main" class="main">
<div class="stack stack--lg" style="max-width: var(--narrow)">
  <div>
    <p style="margin-bottom: var(--spacing-sm)"><a class="btn btn--ghost" href="SCR-03-board--owner.html"><span class="ic ic-left" aria-hidden="true"></span>Back to board</a></p>
    <h1 class="t-h2">New job</h1>
    <div class="msg msg--error" role="alert" style="margin-top: var(--spacing-md)"><span class="ic ic-alert" aria-hidden="true"></span><div>Nothing was saved. Fix the 5 fields marked below.</div></div>
  </div>
  <form class="stack" novalidate>
    <div class="form-grid">
      <div class="field field--error full"><label for="title">Job title<span class="req">required</span></label><input type="text" id="title" name="title" required aria-invalid="true" aria-describedby="title-e"><p class="err" id="title-e"><span class="ic ic-alert" aria-hidden="true"></span><span>Enter a job title</span></p></div>
      <div class="field field--error full"><label for="tech">Technician<span class="req">required</span></label>
        <select id="tech" name="tech" required aria-invalid="true" aria-describedby="tech-e"><option value="" selected>Choose a technician</option><option value="a">Tech A</option><option value="b">Tech B</option><option value="c">Tech C</option></select><p class="err" id="tech-e"><span class="ic ic-alert" aria-hidden="true"></span><span>Choose a technician</span></p></div>
      <div class="field"><label for="date">Date<span class="req">required</span></label><input type="date" id="date" name="date" required value="2026-11-12"></div>
      <div class="field field--error"><label for="time">Start time<span class="req">required</span></label><input type="time" id="time" name="time" required aria-invalid="true" aria-describedby="time-e"><p class="err" id="time-e"><span class="ic ic-alert" aria-hidden="true"></span><span>Enter a start time</span></p></div>
      <div class="field field--error full"><label for="addr">Address<span class="req">required</span></label><input type="text" id="addr" name="addr" required aria-invalid="true" aria-describedby="addr-e"><p class="err" id="addr-e"><span class="ic ic-alert" aria-hidden="true"></span><span>Enter an address</span></p></div>
      <div class="field"><label for="cust">Customer name</label><input type="text" id="cust" name="cust"></div>
      <div class="field field--error"><label for="phone">Customer phone</label><input type="tel" id="phone" name="phone" value="call me" aria-invalid="true" aria-describedby="phone-e"><p class="err" id="phone-e"><span class="ic ic-alert" aria-hidden="true"></span><span>Enter a valid phone number</span></p></div>
      <div class="field full"><label for="notes">Notes</label><textarea id="notes" name="notes"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn btn--primary" type="submit">Save job</button>
      <a class="btn btn--ghost" href="SCR-03-board--owner.html">Back without saving</a>
    </div>
  </form>
</div>
</main>
</div>
</body>
</html>
