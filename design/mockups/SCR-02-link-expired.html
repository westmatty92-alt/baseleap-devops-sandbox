<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link expired · Northside Plumbing job board</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="center">
  <section class="card stack" aria-labelledby="t">
    <p class="brand__name">Northside Plumbing · Job board</p>
    <span class="ic ic--lg ic-clock" aria-hidden="true"></span>
    <h1 class="t-h3" id="t">This link has expired or was already used</h1>
    <p>Sign-in links work once and expire after 60 minutes. Ask for a new one below.</p>
    <form class="stack" novalidate>
      <div class="field">
        <label for="email">Email<span class="req">required</span></label>
        <input type="email" id="email" name="email" required autocomplete="email" inputmode="email" autocapitalize="none">
      </div>
      <button class="btn btn--primary btn--block" type="submit">Email me a new link</button>
    </form>
  </section>
</main>
</body>
</html>
